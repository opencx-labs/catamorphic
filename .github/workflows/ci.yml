name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catamorphic
          POSTGRES_PASSWORD: catamorphic
          POSTGRES_DB: catamorphic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catamorphic -d catamorphic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://catamorphic:catamorphic@127.0.0.1:5432/catamorphic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ARTIFACTS_NAMESPACE: ${{ secrets.CLOUDFLARE_ARTIFACTS_NAMESPACE }}
      CLOUDFLARE_SANDBOX_API_URL: ${{ secrets.CLOUDFLARE_SANDBOX_API_URL }}
      CLOUDFLARE_SANDBOX_API_KEY: ${{ secrets.CLOUDFLARE_SANDBOX_API_KEY }}
      CF_SANDBOX_INTEGRATION: ${{ secrets.CLOUDFLARE_SANDBOX_API_URL != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run db:migrate
      - run: bun run db:codegen
      - run: git diff --exit-code -- packages/db/src/generated/db.ts
      - run: bun run test
      - name: PWA end-to-end tests
        run: bun run --cwd apps/pwa test:e2e
      - name: Desktop end-to-end tests (visible realism)
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" bun run --cwd apps/desktop test:e2e:visible
      - name: Desktop end-to-end tests (hidden)
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" bun run --cwd apps/desktop test:e2e
      - name: Publish packages to the local eval registry
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: ./infra/local-registry/publish.sh
      - name: Model-in-the-loop desktop eval
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        env:
          CATAMORPHIC_EVAL: "1"
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" bun run --cwd apps/desktop test:eval
