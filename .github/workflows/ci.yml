name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

# PRs reuse successful content hashes. Main and manual runs execute tests fresh.
env:
  CATAMORPHIC_REUSE_TESTS: ${{ github.event_name == 'pull_request' && '1' || '0' }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  access:
    name: Repository write access
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check contributor permission
        id: permission
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("allowed", "true");
              return;
            }

            const username = context.payload.pull_request.user.login;
            let permission = "none";
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username,
              });
              permission = response.data.permission;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const allowed = ["admin", "maintain", "write"].includes(permission);
            core.info(`${username} has ${permission} permission; full CI allowed: ${allowed}`);
            core.setOutput("allowed", String(allowed));

  shards:
    name: Plan test shards
    needs: access
    if: needs.access.outputs.allowed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.plan.outputs.workspace }}
      desktop_linux: ${{ steps.plan.outputs.desktop_linux }}
      desktop_macos: ${{ steps.plan.outputs.desktop_macos }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: shards
      - id: plan
        run: bun scripts/ci-shards.ts "$GITHUB_OUTPUT"

  validation:
    needs: access
    if: needs.access.outputs.allowed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: validation
      - run: bun run check --lane=validation
      - uses: ./.github/actions/test-cache-save
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          key: ${{ steps.setup.outputs.task-cache-key }}
      - name: Upload task execution summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: turbo-validation
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  workspace:
    needs: [access, shards]
    if: needs.access.outputs.allowed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.workspace) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: workspace-${{ matrix.shard }}
      - run: bun run check --lane=workspace --shard=${{ matrix.shard }}/${{ matrix.total }}
      - uses: ./.github/actions/test-cache-save
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          key: ${{ steps.setup.outputs.task-cache-key }}
      - name: Upload task execution summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: turbo-workspace-${{ matrix.shard }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  pwa:
    needs: access
    if: needs.access.outputs.allowed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: pwa
      - name: Require Chrome for real browser coverage
        run: test -x /usr/bin/google-chrome || test -x /usr/bin/chromium
      - run: bun scripts/tool-runtime.ts turbo run test:e2e:ci --filter=catamorphic-pwa --concurrency=2 --force=${{ github.event_name != 'pull_request' }} --output-logs=new-only --summarize
      - uses: ./.github/actions/test-cache-save
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          key: ${{ steps.setup.outputs.task-cache-key }}
      - name: Upload task execution summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: turbo-pwa
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  desktop-linux:
    needs: [access, shards]
    if: needs.access.outputs.allowed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.desktop_linux) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: desktop-linux-${{ matrix.shard }}
      - name: Install private desktop
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth x11-utils xdotool openbox
          display_versions=$(dpkg-query -W --showformat='${Package}=${Version}\n' | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)
          echo "CATAMORPHIC_TEST_RUNTIME=$CATAMORPHIC_TEST_RUNTIME|display=$display_versions" >> "$GITHUB_ENV"
      - name: Test on a private desktop
        env:
          CATAMORPHIC_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: bun scripts/tool-runtime.ts turbo run test:e2e:ci --filter=catamorphic-desktop --concurrency=2 --force=${{ github.event_name != 'pull_request' }} --output-logs=new-only --summarize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/test-cache-save
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          key: ${{ steps.setup.outputs.task-cache-key }}
      - name: Upload task execution summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: turbo-desktop-linux-${{ matrix.shard }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  desktop-macos:
    needs: [access, shards]
    if: needs.access.outputs.allowed == 'true'
    # Keep native Cocoa/menu/Command-key coverage on a dedicated Apple desktop.
    # Blacksmith is already enabled for Linux in this org; macOS remains on
    # GitHub until the org's Blacksmith macOS entitlement is confirmed.
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.desktop_macos) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: desktop-macos-${{ matrix.shard }}
      - name: Test native macOS desktop
        env:
          # The runner inherits Bash; desktop terminals on macOS use Zsh,
          # including the real OSC 133 and in-app URL shell integration.
          SHELL: /bin/zsh
          CATAMORPHIC_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        # Hosted images disable motion/transparency globally; use the ordinary
        # desktop settings so animation assertions exercise the actual app.
        # https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/configure-system.sh
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          bun scripts/tool-runtime.ts turbo run test:e2e:ci --filter=catamorphic-desktop --concurrency=2 --force=${{ github.event_name != 'pull_request' }} --output-logs=new-only --summarize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/test-cache-save
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          key: ${{ steps.setup.outputs.task-cache-key }}
      - name: Upload task execution summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: turbo-desktop-macos-${{ matrix.shard }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  checks:
    name: checks
    needs: [access, shards, validation, workspace, pwa, desktop-linux, desktop-macos]
    if: always() && needs.access.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane
        env:
          ALLOWED: ${{ needs.access.outputs.allowed }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          test "$ALLOWED" = true
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")'

  eval:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      MODEL_EVAL_AVAILABLE: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.OPENAI_API_KEY != '') && '1' || '' }}
      CATAMORPHIC_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/test-results/eval
    steps:
      - uses: actions/checkout@v7
        if: env.MODEL_EVAL_AVAILABLE == '1'
      - uses: ./.github/actions/test-setup
        id: setup
        if: env.MODEL_EVAL_AVAILABLE == '1'
        with:
          cache-suffix: eval
      - name: Prepare eval desktop
        if: env.MODEL_EVAL_AVAILABLE == '1'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth x11-utils xdotool openbox
          mkdir -p "$CATAMORPHIC_E2E_ARTIFACTS_DIR"
          bun run build
      - name: Publish packages to the local eval registry
        if: github.event_name != 'pull_request' && env.MODEL_EVAL_AVAILABLE == '1'
        run: ./infra/local-registry/publish.sh
      - name: Model-in-the-loop desktop eval
        if: github.event_name != 'pull_request' && env.MODEL_EVAL_AVAILABLE == '1'
        env:
          CATAMORPHIC_EVAL: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ARTIFACTS_NAMESPACE: ${{ secrets.CLOUDFLARE_ARTIFACTS_NAMESPACE }}
          CLOUDFLARE_SANDBOX_API_URL: ${{ secrets.CLOUDFLARE_SANDBOX_API_URL }}
          CLOUDFLARE_SANDBOX_API_KEY: ${{ secrets.CLOUDFLARE_SANDBOX_API_KEY }}
          CF_SANDBOX_INTEGRATION: ${{ secrets.CLOUDFLARE_SANDBOX_API_URL != '' && '1' || '' }}
        run: xvfb-run -a --server-args="-screen 0 1440x900x24 -nolisten tcp" bash scripts/desktop-test-display.sh bun run --cwd apps/desktop test:eval
