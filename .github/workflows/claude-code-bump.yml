name: Claude Code bump

# Opens a pull request when a new Claude Agent SDK is published (ADR 0196):
# the bundled SDK, the Claude Code version an installed copy must reach,
# and every platform executable's integrity move together. CI decides
# whether it merges; nothing ships without review.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to pin (default latest)
        required: false

permissions:
  contents: write
  pull-requests: write
  # Pull requests opened with this token start no workflows; CI is
  # dispatched on the branch instead, which reports on the same commit.
  actions: write

concurrency:
  group: claude-code-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin the latest release
        id: bump
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: bun scripts/claude-code-bump.ts "$VERSION" --output "$GITHUB_OUTPUT"
      - name: Look for an existing pull request
        id: existing
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/claude-code-${{ steps.bump.outputs.sdk }}
        run: |
          # A pull request for this version, open or closed, is the answer
          # already: a closed one means someone decided against it.
          count=$(gh pr list --head "$BRANCH" --state all --json number --jq length)
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Update the lockfile and check the pins
        if: steps.bump.outputs.changed == 'true' && steps.existing.outputs.found == 'false'
        run: |
          bun install
          bun run test:scripts -- scripts/claude-code-bump.test.ts
      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true' && steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/claude-code-${{ steps.bump.outputs.sdk }}
          FROM: ${{ steps.bump.outputs.from }}
          SDK: ${{ steps.bump.outputs.sdk }}
          CLI: ${{ steps.bump.outputs.cli }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add packages/claude-code/package.json apps/desktop/src/main/harness-components.ts bun.lock
          git commit -m "Bump Claude Code to $CLI (Agent SDK $SDK)"
          git push origin "$BRANCH"
          body=$(cat <<EOF
          Moves the Claude Agent SDK from $FROM to $SDK, which ships Claude Code $CLI. Work runs a person's installed Claude Code when it is $CLI or newer, and downloads this pinned copy otherwise (ADR 0196).

          Updated together by \`scripts/claude-code-bump.ts\`:
          - \`packages/claude-code/package.json\` and \`bun.lock\`
          - \`CLAUDE_VERSION\`, \`CLAUDE_CODE_MIN_VERSION\` and every platform's integrity in \`apps/desktop/src/main/harness-components.ts\`

          Before merging, read the SDK changelog for protocol changes and let CI's native Claude Code tests pass. Opened by the scheduled Claude Code bump workflow.
          EOF
          )
          gh pr create --base main --head "$BRANCH" \
            --title "Bump Claude Code to $CLI" --body "$body"
          gh workflow run ci.yml --ref "$BRANCH"
          # Older bump pull requests are superseded by this one.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/claude-code-\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r number; do
              gh pr close "$number" --delete-branch --comment "Superseded by the bump to $CLI."
            done
