name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build, sign, and notarize macOS
    runs-on: macos-15
    timeout-minutes: 90
    environment: desktop-release
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_kind: ${{ steps.release.outputs.release_kind }}
      update_metadata: ${{ steps.release.outputs.update_metadata }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - run: bun install --frozen-lockfile

      - id: release
        name: Verify release identity
        shell: bash
        run: |
          package_version="$(bun -e 'const value = await Bun.file("apps/desktop/package.json").json(); console.log(value.version)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="desktop-v${package_version}"
          fi
          version="$(bun scripts/desktop-release.ts verify --tag "${release_tag}" --package-version "${package_version}")"
          release_kind="$(bun scripts/desktop-release.ts release-kind --version "${version}")"
          update_metadata="$(bun scripts/desktop-release.ts update-metadata-name --version "${version}")"
          {
            echo "version=${version}"
            echo "tag=${release_tag}"
            echo "release_kind=${release_kind}"
            echo "update_metadata=${update_metadata}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare signing and notarization credentials
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "${APPLE_API_KEY_P8_BASE64}" || { echo "APPLE_API_KEY_P8_BASE64 is not configured" >&2; exit 1; }
          test -n "${MACOS_CERTIFICATE_P12_BASE64}" || { echo "MACOS_CERTIFICATE_P12_BASE64 is not configured" >&2; exit 1; }
          test -n "${MACOS_CERTIFICATE_PASSWORD}" || { echo "MACOS_CERTIFICATE_PASSWORD is not configured" >&2; exit 1; }
          test -n "${APPLE_API_KEY_ID}" || { echo "APPLE_API_KEY_ID is not configured" >&2; exit 1; }
          test -n "${APPLE_API_ISSUER}" || { echo "APPLE_API_ISSUER is not configured" >&2; exit 1; }
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"

      - name: Verify Homebrew publication access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "${GH_TOKEN}" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          can_push="$(gh api repos/opencx-labs/homebrew-tap --jq '.permissions.push')"
          test "${can_push}" = "true" || { echo "HOMEBREW_TAP_TOKEN cannot push to opencx-labs/homebrew-tap" >&2; exit 1; }

      - name: Build signed and notarized application
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run build
          bun run --cwd apps/desktop package

      - name: Prepare update metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPDATE_METADATA: ${{ steps.release.outputs.update_metadata }}
        run: |
          bun scripts/desktop-release.ts prepare-update-metadata --version "${VERSION}" --input "apps/desktop/release/${UPDATE_METADATA}"

      - name: Verify packaged application
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPDATE_METADATA: ${{ steps.release.outputs.update_metadata }}
        run: |
          app="apps/desktop/release/mac-arm64/Catamorphic.app"
          dmg="apps/desktop/release/Catamorphic-${VERSION}-arm64.dmg"
          zip="apps/desktop/release/Catamorphic-${VERSION}-arm64.zip"
          dmg_blockmap="${dmg}.blockmap"
          zip_blockmap="${zip}.blockmap"
          update_metadata="apps/desktop/release/${UPDATE_METADATA}"
          test -d "${app}"
          test -f "${dmg}"
          test -f "${zip}"
          test -f "${dmg_blockmap}"
          test -f "${zip_blockmap}"
          test -f "${update_metadata}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          signature="$(codesign --display --verbose=4 "${app}" 2>&1)"
          grep -q '^Authority=Developer ID Application:' <<< "${signature}"
          team_id="$(awk -F= '/^TeamIdentifier=/ { print $2 }' <<< "${signature}")"
          test -n "${team_id}"
          test "${team_id}" != "not set"
          spctl --assess --type execute --verbose=2 "${app}"
          xcrun stapler validate "${app}"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          scheme="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "${app}/Contents/Info.plist")"
          test "${bundle_id}" = "dev.catamorphic.desktop"
          test "${scheme}" = "catamorphic"
          (
            cd apps/desktop/release
            shasum -a 256 \
              "Catamorphic-${VERSION}-arm64.dmg" \
              "Catamorphic-${VERSION}-arm64.dmg.blockmap" \
              "Catamorphic-${VERSION}-arm64.zip" \
              "Catamorphic-${VERSION}-arm64.zip.blockmap" \
              "${UPDATE_METADATA}" > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: catamorphic-${{ steps.release.outputs.version }}-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/Catamorphic-${{ steps.release.outputs.version }}-arm64.dmg
            apps/desktop/release/Catamorphic-${{ steps.release.outputs.version }}-arm64.dmg.blockmap
            apps/desktop/release/Catamorphic-${{ steps.release.outputs.version }}-arm64.zip
            apps/desktop/release/Catamorphic-${{ steps.release.outputs.version }}-arm64.zip.blockmap
            apps/desktop/release/${{ steps.release.outputs.update_metadata }}
            apps/desktop/release/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_KIND: ${{ steps.release.outputs.release_kind }}
          UPDATE_METADATA: ${{ steps.release.outputs.update_metadata }}
        run: |
          assets=(
            "apps/desktop/release/Catamorphic-${VERSION}-arm64.dmg"
            "apps/desktop/release/Catamorphic-${VERSION}-arm64.dmg.blockmap"
            "apps/desktop/release/Catamorphic-${VERSION}-arm64.zip"
            "apps/desktop/release/Catamorphic-${VERSION}-arm64.zip.blockmap"
            "apps/desktop/release/${UPDATE_METADATA}"
            "apps/desktop/release/SHA256SUMS.txt"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            if [[ "${RELEASE_KIND}" == "preview" ]]; then
              gh release edit "${TAG}" --prerelease --latest=false --title "Catamorphic ${VERSION} for macOS"
            else
              gh release edit "${TAG}" --prerelease=false --latest=true --title "Catamorphic ${VERSION} for macOS"
            fi
          else
            release_flags=(--verify-tag --generate-notes --title "Catamorphic ${VERSION} for macOS")
            if [[ "${RELEASE_KIND}" == "preview" ]]; then
              release_flags+=(--prerelease --latest=false --notes "Apple silicon Preview release for macOS 12 or newer. Preview builds may contain regressions, so back up important projects before upgrading.")
            else
              release_flags+=(--latest=true --notes "Apple silicon Stable release for macOS 12 or newer.")
            fi
            gh release create "${TAG}" "${assets[@]}" "${release_flags[@]}"
          fi

      - name: Update Homebrew cask
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_KIND: ${{ steps.release.outputs.release_kind }}
          UPDATE_METADATA: ${{ steps.release.outputs.update_metadata }}
        run: |
          test -n "${GH_TOKEN}" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          sha256="$(awk '/\.dmg$/ { print $1 }' apps/desktop/release/SHA256SUMS.txt)"
          tap_path="$(brew --repository)/Library/Taps/opencx-labs/homebrew-tap"
          mkdir -p "$(dirname "${tap_path}")"
          gh auth setup-git
          gh repo clone opencx-labs/homebrew-tap "${tap_path}"
          cask_files=("catamorphic@alpha.rb")
          if [[ "${RELEASE_KIND}" == "stable" ]]; then
            cask_files=("catamorphic.rb" "catamorphic@alpha.rb")
          fi
          for cask_file in "${cask_files[@]}"; do
            if [[ "${cask_file}" == "catamorphic.rb" ]]; then
              cask_channel="stable"
            else
              cask_channel="preview"
            fi
            bun scripts/desktop-release.ts write-cask --version "${VERSION}" --sha256 "${sha256}" --channel "${cask_channel}" --output "${tap_path}/Casks/${cask_file}"
          done
          mkdir -p "${tap_path}/updates"
          cp "apps/desktop/release/${UPDATE_METADATA}" "${tap_path}/updates/${UPDATE_METADATA}"
          update_files=("${UPDATE_METADATA}")
          if [[ "${RELEASE_KIND}" == "stable" ]]; then
            cp "apps/desktop/release/${UPDATE_METADATA}" "${tap_path}/updates/alpha-mac.yml"
            update_files+=("alpha-mac.yml")
          fi
          for cask_file in "${cask_files[@]}"; do
            ruby -c "${tap_path}/Casks/${cask_file}"
            brew style --cask "${tap_path}/Casks/${cask_file}"
          done
          git -C "${tap_path}" config user.name "github-actions[bot]"
          git -C "${tap_path}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for cask_file in "${cask_files[@]}"; do
            git -C "${tap_path}" add "Casks/${cask_file}"
          done
          for update_file in "${update_files[@]}"; do
            git -C "${tap_path}" add "updates/${update_file}"
          done
          if ! git -C "${tap_path}" diff --cached --quiet; then
            git -C "${tap_path}" commit -m "catamorphic ${VERSION}"
            git -C "${tap_path}" push origin HEAD:main
          fi
