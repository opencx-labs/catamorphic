name: Desktop prerelease

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build, sign, and notarize macOS
    runs-on: macos-15
    timeout-minutes: 90
    environment: desktop-release
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bun install --frozen-lockfile

      - id: release
        name: Verify release identity
        shell: bash
        run: |
          package_version="$(bun -e 'const value = await Bun.file("apps/desktop/package.json").json(); console.log(value.version)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="desktop-v${package_version}"
          fi
          version="$(bun scripts/desktop-release.ts verify --tag "${release_tag}" --package-version "${package_version}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Prepare signing and notarization credentials
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "${APPLE_API_KEY_P8_BASE64}" || { echo "APPLE_API_KEY_P8_BASE64 is not configured" >&2; exit 1; }
          test -n "${MACOS_CERTIFICATE_P12_BASE64}" || { echo "MACOS_CERTIFICATE_P12_BASE64 is not configured" >&2; exit 1; }
          test -n "${MACOS_CERTIFICATE_PASSWORD}" || { echo "MACOS_CERTIFICATE_PASSWORD is not configured" >&2; exit 1; }
          test -n "${APPLE_API_KEY_ID}" || { echo "APPLE_API_KEY_ID is not configured" >&2; exit 1; }
          test -n "${APPLE_API_ISSUER}" || { echo "APPLE_API_ISSUER is not configured" >&2; exit 1; }
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"

      - name: Build signed and notarized application
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run build
          bun run --cwd apps/desktop package

      - name: Verify packaged application
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          app="apps/desktop/release/mac-arm64/Catamorphic.app"
          dmg="apps/desktop/release/Catamorphic-${VERSION}-arm64.dmg"
          zip="apps/desktop/release/Catamorphic-${VERSION}-arm64.zip"
          test -d "${app}"
          test -f "${dmg}"
          test -f "${zip}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          signature="$(codesign --display --verbose=4 "${app}" 2>&1)"
          grep -q '^Authority=Developer ID Application:' <<< "${signature}"
          team_id="$(awk -F= '/^TeamIdentifier=/ { print $2 }' <<< "${signature}")"
          test -n "${team_id}"
          test "${team_id}" != "not set"
          spctl --assess --type execute --verbose=2 "${app}"
          xcrun stapler validate "${app}"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          scheme="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "${app}/Contents/Info.plist")"
          test "${bundle_id}" = "dev.catamorphic.desktop"
          test "${scheme}" = "catamorphic"
          (
            cd apps/desktop/release
            shasum -a 256 "Catamorphic-${VERSION}-arm64.dmg" "Catamorphic-${VERSION}-arm64.zip" > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: catamorphic-${{ steps.release.outputs.version }}-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/Catamorphic-${{ steps.release.outputs.version }}-arm64.dmg
            apps/desktop/release/Catamorphic-${{ steps.release.outputs.version }}-arm64.zip
            apps/desktop/release/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets=(
            "apps/desktop/release/Catamorphic-${VERSION}-arm64.dmg"
            "apps/desktop/release/Catamorphic-${VERSION}-arm64.zip"
            "apps/desktop/release/SHA256SUMS.txt"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --prerelease --latest=false --title "Catamorphic ${VERSION} for macOS"
          else
            gh release create "${TAG}" "${assets[@]}" --verify-tag --prerelease --latest=false --generate-notes --notes "First macOS alpha for Apple silicon on macOS 12 or newer. Install the DMG directly or use the Homebrew command in the README. This is prerelease software, so back up important projects before upgrading." --title "Catamorphic ${VERSION} for macOS"
          fi

      - name: Update Homebrew cask
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "${GH_TOKEN}" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          sha256="$(awk '/\.dmg$/ { print $1 }' apps/desktop/release/SHA256SUMS.txt)"
          tap_path="$(brew --repository)/Library/Taps/opencx-labs/homebrew-tap"
          mkdir -p "$(dirname "${tap_path}")"
          gh auth setup-git
          gh repo clone opencx-labs/homebrew-tap "${tap_path}"
          bun scripts/desktop-release.ts write-cask --version "${VERSION}" --sha256 "${sha256}" --output "${tap_path}/Casks/catamorphic.rb"
          ruby -c "${tap_path}/Casks/catamorphic.rb"
          brew style --cask "${tap_path}/Casks/catamorphic.rb"
          git -C "${tap_path}" config user.name "github-actions[bot]"
          git -C "${tap_path}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${tap_path}" add Casks/catamorphic.rb
          if ! git -C "${tap_path}" diff --cached --quiet; then
            git -C "${tap_path}" commit -m "catamorphic ${VERSION}"
            git -C "${tap_path}" push origin HEAD:main
          fi
