# TEMPORARY: reruns the macOS shards with the flaky e2e tests on this branch
# only, to see them fail with diagnostics. Removed before merging.
name: Flake hunt

on:
  push:
    branches: [macos-e2e-flakes]

permissions:
  contents: read

jobs:
  hunt:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [3, 6]
        repeat: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        id: setup
        with:
          cache-suffix: desktop-macos-${{ matrix.shard }}
          electron: "true"
      - name: Test native macOS desktop
        env:
          SHELL: /bin/zsh
          CATAMORPHIC_TEST_SHARD: ${{ matrix.shard }}/9
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          bun scripts/tool-runtime.ts turbo run test:e2e:ci --filter=catamorphic-desktop --concurrency=2 --force=true --output-logs=new-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{ matrix.shard }}-${{ matrix.repeat }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
