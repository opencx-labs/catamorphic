name: Diagnose fork hover on macOS
on:
  push:
    branches: [diagnostic/alpha30-fork-hover]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [control, listener, geometry]
    env:
      CATAMORPHIC_REUSE_TESTS: "1"
      DIAG_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        with:
          cache-suffix: desktop-macos-7
          electron: "true"
      - name: Add read-only pointer diagnostics
        run: python3 .github/fork-hover-diagnostic.py
      - name: Trace the real fork interaction
        env:
          SHELL: /bin/zsh
          CATAMORPHIC_TEST_SHARD: 7/10
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          bun scripts/tool-runtime.ts turbo run test:e2e:ci --filter=catamorphic-desktop --concurrency=2 --force --output-logs=new-only --summarize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-hover-diagnostic-${{ matrix.variant }}
          path: |
            test-results/
            /tmp/fork-hover-display.png
            /tmp/fork-privacy.log
            /tmp/fork-processes.log
          retention-days: 7
