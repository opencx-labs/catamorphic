name: Google sign-in

# Google's sign-in turns away browsers it takes for embedded or disguised
# ones ("This browser or app may not be secure"), and changes that gate
# without notice (ADR 0150). Every day, and on changes to what pages see of
# Work, a Work tab takes the first sign-in step with a made-up address and
# must get past the gate, as real Chrome does. A failed daily run opens (or
# adds to) an issue.
on:
  schedule:
    - cron: "41 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/google-sign-in.yml
      - apps/desktop/e2e/google-sign-in.e2e.ts
      - apps/desktop/package.json
      - apps/desktop/src/main/browser.ts
      - apps/desktop/src/main/index.ts
      - apps/desktop/src/preload/chrome-object.ts
      - apps/desktop/src/preload/client-hints.ts
      - apps/desktop/src/preload/session.ts
      - apps/desktop/src/shared/chrome-brands.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-sign-in-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sign-in:
    name: A Work tab gets past Google's gate
    # The platform Work ships on; hosted macOS images carry Google Chrome for
    # the control run.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-setup
        with:
          cache-suffix: google-sign-in
          electron: "true"
      - name: Sign in to Google in a Work tab
        env:
          CATAMORPHIC_EXTERNAL_INTEGRATIONS: "1"
        run: bun scripts/tool-runtime.ts turbo run test:e2e:ci --filter=catamorphic-desktop --force --output-logs=new-only -- e2e/google-sign-in.e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-sign-in
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report a refusal
    needs: sign-in
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or add to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Google's sign-in refuses Work"
          body="The daily Google sign-in check failed: $RUN_URL. Its artifact has the page Work got. ADR 0150 records what Google's gate has looked for so far."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
