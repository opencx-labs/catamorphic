appId: dev.catamorphic.desktop
productName: Catamorphic
copyright: Copyright © 2026 The Catamorphic Authors
artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../pwa/dist
    to: pwa
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE
    to: NOTICE.txt
protocols:
  - name: Catamorphic connect link
    schemes:
      - catamorphic
publish:
  provider: generic
  url: https://raw.githubusercontent.com/opencx-labs/homebrew-tap/main/updates
  publishAutoUpdate: true
# Packages that load assets or native code from disk at runtime must escape
# the asar archive: pglite (wasm), microsandbox (NAPI addon + platform
# binaries), catamorphic db migrations (.sql read via fs), and the runtime
# dist files the stdio provider uploads into sandboxes.
asarUnpack:
  - "**/node_modules/@electric-sql/pglite/**"
  - "**/node_modules/@lydell/node-pty*/**"
  - "**/node_modules/microsandbox/**"
  - "**/node_modules/@superradcompany/**"
  - "**/node_modules/@catamorphic/db/migrations/**"
  - "**/node_modules/@catamorphic/runtime/dist/**"
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    NSLocalNetworkUsageDescription: Catamorphic uses your local network so your phone can continue this workspace.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  title: "Catamorphic ${version}"
  iconSize: 128
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
linux:
  target:
    - AppImage
